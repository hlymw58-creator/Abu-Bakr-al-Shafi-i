<!-- ===== صورة تفاعلية: مستر أبو بكر الشافعي (أسفل القائمة الجانبية) ===== -->
<style id="hlAvatarCss">
  :root {
    --hl-av-w: 140px;
    --hl-av-h: 243px;                       /* 140 × (591/340) */
    --hl-w: var(--sb-open, 236px);          /* عرض القائمة الجانبية */
    --hl-spacer: calc(var(--hl-av-h) + 14px);
    --hl-tip-x: calc((var(--hl-w) + var(--hl-av-w)) / 2 + 18px);
    --hl-tip-y: 64%;
  }
  @media (max-width: 899px) { :root { --hl-w: min(80vw, 270px); } }

  /* مساحة فاضية آخر القائمة عشان الصورة ما تغطيش أي زر */
  body.hl-av #sideNav::after { content: ""; flex: none; height: var(--hl-spacer); }

  /* ---------- الحاوية + أنيميشن الدخول (transform + opacity فقط) ---------- */
  #hlAvatar {
    position: fixed; right: 0; bottom: 0; z-index: 152;
    width: var(--hl-w); height: var(--hl-av-h);
    pointer-events: none;
    visibility: hidden; opacity: 0;
    transform: translate3d(38px, 0, 0);
    transition: opacity .35s ease, transform .4s ease, visibility 0s linear .4s;
    will-change: transform, opacity;
  }
  #hlAvatar.is-in {
    visibility: visible; opacity: 1; transform: none;
    transition: opacity .7s ease .15s, transform .9s cubic-bezier(.22, .9, .28, 1) .15s, visibility 0s;
  }

  /* ---------- الصورة + الخلفية ---------- */
  .hl-av-btn {
    position: absolute; bottom: 0; right: calc((var(--hl-w) - var(--hl-av-w)) / 2);
    width: var(--hl-av-w); height: var(--hl-av-h);
    padding: 0; border: 0; background: none; cursor: pointer; pointer-events: auto;
    transform-origin: 50% 100%;
    transition: transform .3s cubic-bezier(.22, .9, .28, 1);
    -webkit-tap-highlight-color: transparent; outline: none;
  }
  /* لوح زجاجي (Glassmorphism) — الراس بيطلع فوقه */
  .hl-av-plate {
    position: absolute; left: 0; right: 0; bottom: 0; height: 72%;
    border-radius: 26px 26px 0 0;
    background: linear-gradient(165deg, rgba(255,255,255,.24), rgba(255,255,255,.07) 58%, rgba(255,213,79,.12));
    border: 1px solid rgba(255,213,79,.4); border-bottom: 0;
    -webkit-backdrop-filter: blur(10px) saturate(1.3); backdrop-filter: blur(10px) saturate(1.3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.38), 0 -10px 30px rgba(0,0,0,.25);
    transition: border-color .3s ease;
  }
  /* توهج دهبي خفيف بيتنفس ببطء */
  .hl-av-glow {
    position: absolute; inset: -16% -24% 0; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 48%, rgba(255,193,7,.45), rgba(255,193,7,0) 66%);
    animation: hlAvBreathe 5.5s ease-in-out infinite;
  }
  #hlAvatar:not(.is-in) .hl-av-glow { animation-play-state: paused; }
  @keyframes hlAvBreathe {
    0%, 100% { transform: scale(.95); opacity: .5; }
    50%      { transform: scale(1.07); opacity: .85; }
  }
  .hl-av-img {
    position: absolute; left: 0; bottom: 0; width: 100%; height: auto; display: block;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,.4));
    transition: transform .4s cubic-bezier(.22, .9, .28, 1);
    -webkit-user-drag: none; user-select: none;
  }
  .hl-av-btn:focus-visible .hl-av-plate { outline: 3px solid #ffb300; outline-offset: 2px; }

  /* ---------- التيكست (Tooltip) ---------- */
  .hl-av-tip {
    position: absolute; right: var(--hl-tip-x); bottom: var(--hl-tip-y);
    white-space: nowrap; pointer-events: none;
    padding: 8px 18px 10px; border-radius: 14px;
    background: linear-gradient(135deg, rgba(13,59,18,.86), rgba(20,83,45,.78));
    border: 1px solid rgba(255,213,79,.48);
    -webkit-backdrop-filter: blur(14px) saturate(1.5); backdrop-filter: blur(14px) saturate(1.5);
    box-shadow: 0 10px 28px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.2);
    opacity: 0; transform: translate3d(14px, 0, 0) scale(.94); transform-origin: 100% 50%;
    transition: opacity .25s ease, transform .4s cubic-bezier(.22, .9, .28, 1);
  }
  .hl-av-tip::after {              /* سهم صغير ناحية الصورة */
    content: ""; position: absolute; top: 50%; right: -6px; width: 10px; height: 10px; margin-top: -5px;
    background: #14532d; transform: rotate(45deg);
    border-top: 1px solid rgba(255,213,79,.48); border-right: 1px solid rgba(255,213,79,.48);
  }
  .hl-av-tip span {
    display: block; font-family: 'Aref Ruqaa', 'Amiri', serif; font-weight: 700; font-size: 1.3rem; line-height: 1.5;
    background: linear-gradient(90deg, #fff3c4, #ffd54f 55%, #ffb300);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  @media (hover: hover) {
    .hl-av-btn:hover .hl-av-img { transform: translate3d(0, -5px, 0) scale(1.025); }
    .hl-av-btn:hover .hl-av-plate { border-color: rgba(255,213,79,.8); }
    .hl-av-btn:hover + .hl-av-tip { opacity: 1; transform: none; }
  }
  .hl-av-btn:focus-visible + .hl-av-tip, #hlAvatar.show .hl-av-tip { opacity: 1; transform: none; }  /* كيبورد + لمس */

  /* ---------- موبايل: الاسم يظهر فوق الراس في نص القائمة (مفيش قص من حافة الشاشة) ---------- */
  @media (max-width: 899px) {
    .hl-av-tip {
      right: 0; left: 0; margin: 0 auto; width: max-content; bottom: calc(100% - 2px);
      transform: translate3d(0, 10px, 0) scale(.94); transform-origin: 50% 100%;
    }
    .hl-av-tip::after {
      top: auto; right: 50%; bottom: -6px; margin: 0 -5px 0 0;
      border-top: 0; border-right: 1px solid rgba(255,213,79,.48); border-bottom: 1px solid rgba(255,213,79,.48);
    }
  }

  /* ---------- القائمة مصغّرة (كمبيوتر) ---------- */
  @media (min-width: 900px) {
    body.sb-collapsed {
      --hl-spacer: calc(var(--hl-av-h) * .4 + 14px);
      --hl-tip-x: calc(var(--sb-closed, 68px) / 2 + var(--hl-av-w) * .2 + 18px);
      --hl-tip-y: calc(var(--hl-av-h) * .27);
    }
    body.sb-collapsed .hl-av-btn { transform: translateX(calc((var(--hl-w) - var(--sb-closed, 68px)) / 2)) scale(.4); }
  }

  /* شاشات قصيرة جداً / طباعة: اخفيها وما تاخدش مساحة */
  @media (max-height: 620px) { #hlAvatar { display: none !important; } body.hl-av { --hl-spacer: 0px; } }
  @media print { #hlAvatar { display: none !important; } }
  @media (prefers-reduced-motion: reduce) {
    #hlAvatar, #hlAvatar.is-in { transform: none; transition: opacity .2s ease, visibility 0s; }
    .hl-av-glow { animation: none; opacity: .6; }
    .hl-av-tip { transform: none; transition: opacity .2s ease; }
    .hl-av-img, .hl-av-btn { transition: none; }
  }
</style>

<script>
/* ظهور الصورة: بعد الانترو + مع القائمة الجانبية (على الموبايل مع فتح القائمة) */
(function () {
  "use strict";
  var REQUIRE_SIDEBAR = true;   // false = تظهر حتى لو القائمة الجانبية مش موجودة (زي شاشة الدخول)
  var av = document.getElementById("hlAvatar");
  if (!av) return;
  var body = document.body, desk = window.matchMedia("(min-width:900px)"),
      touch = window.matchMedia("(hover:none)"), last = null, t = 0;
  body.classList.add("hl-av");

  function shouldShow() {
    if (document.getElementById("hlIntro")) return false;                      // استنى الانترو يخلص
    if (REQUIRE_SIDEBAR && !body.classList.contains("sb-on")) return false;    // مفيش قائمة = مفيش صورة
    return desk.matches || body.classList.contains("sb-open");                 // موبايل: مع فتح القائمة
  }
  function sync() {
    var s = shouldShow();
    if (s === last) return;
    last = s;
    av.classList.toggle("is-in", s);
    if (!s) av.classList.remove("show");
  }

  new MutationObserver(sync).observe(body, { attributes: true, attributeFilter: ["class"], childList: true });
  (desk.addEventListener ? desk.addEventListener("change", sync) : desk.addListener(sync));
  sync(); setTimeout(sync, 6200);

  /* على اللمس: ضغطة = يظهر الاسم ثواني */
  av.querySelector(".hl-av-btn").addEventListener("click", function (e) {
    if (!touch.matches) return;
    e.stopPropagation(); av.classList.add("show");
    clearTimeout(t); t = setTimeout(function () { av.classList.remove("show"); }, 2800);
  });
  document.addEventListener("click", function () { av.classList.remove("show"); });
})();
</script>
